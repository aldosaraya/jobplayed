<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | RadarJobs</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#121317; color:#e3e2e8; font-family:'IBM Plex Sans',system-ui,sans-serif; }
  .font-display { font-family:'IBM Plex Mono',monospace; }
  input, select { color-scheme: dark; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="w-full border-b border-[#4d4354]/40">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="font-display text-base font-semibold tracking-tight text-[#ddb7ff]">RADARJOBS</a>
    <div class="flex items-center gap-5 text-sm text-[#cfc2d6]">
      <a href="jobs.html" class="hover:text-white transition-colors">Explore Jobs</a>
      <a href="pricing.html" class="hover:text-white transition-colors">Pro Alerts</a>
      <a href="login.html" class="hover:text-white transition-colors">Log In</a>
    </div>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-6 py-14">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="font-display text-2xl font-semibold tracking-tight mb-2">Create your account</h1>
      <p class="text-sm text-[#cfc2d6]">Free, no card required. First radar lands Monday.</p>
    </div>

    <form id="signup-form" class="bg-[#1f1f24] rounded-xl p-6 flex flex-col gap-4 border border-[#4d4354]/30">

      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs uppercase tracking-wider text-[#988d9f]">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               placeholder="you@domain.com"
               class="w-full bg-[#121317] border border-[#4d4354]/60 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#ddb7ff] transition-colors placeholder:text-[#4d4354]"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs uppercase tracking-wider text-[#988d9f]">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
               placeholder="At least 8 characters"
               class="w-full bg-[#121317] border border-[#4d4354]/60 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#ddb7ff] transition-colors placeholder:text-[#4d4354]"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="role" class="text-xs uppercase tracking-wider text-[#988d9f]">Primary role</label>
        <select id="role" name="role"
                class="w-full bg-[#121317] border border-[#4d4354]/60 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#ddb7ff] transition-colors">
          <option value="tech">Software Engineering &amp; Architecture</option>
          <option value="data">Data Science, Analytics &amp; Data Engineering</option>
          <option value="design">Product Design, UI/UX &amp; Design Systems</option>
          <option value="product">Product Management &amp; Tech Operations</option>
          <option value="devops">DevOps, Cloud Infrastructure &amp; Security</option>
        </select>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="region" class="text-xs uppercase tracking-wider text-[#988d9f]">Region</label>
        <select id="region" name="region"
                class="w-full bg-[#121317] border border-[#4d4354]/60 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#ddb7ff] transition-colors">
          <option value="worldwide">Worldwide + Latam friendly</option>
          <option value="latam">Latin America only</option>
          <option value="us">US / North America remote</option>
          <option value="eu">Europe / UK timezone</option>
        </select>
      </div>

      <div id="msg" class="hidden rounded-lg px-3 py-2.5 text-sm"></div>

      <button id="submit-btn" type="submit"
              class="w-full py-3 rounded-lg bg-[#ddb7ff] text-[#490080] font-semibold text-sm hover:bg-[#f0dbff] transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
        Create free account
      </button>

      <p class="text-xs text-[#988d9f] text-center leading-relaxed">
        By creating an account you agree to the terms of service and privacy policy.
      </p>
    </form>

    <p class="text-center text-sm text-[#cfc2d6] mt-6">
      Already have an account?
      <a href="login.html" class="text-[#ddb7ff] hover:underline font-medium">Log in</a>
    </p>
  </div>
</main>

<script type="module">
import { signUp } from "./auth.js";

const form = document.getElementById("signup-form");
const btn = document.getElementById("submit-btn");
const msg = document.getElementById("msg");

function show(text, kind) {
  msg.textContent = text;
  msg.className =
    "rounded-lg px-3 py-2.5 text-sm " +
    (kind === "error"
      ? "bg-[#93000a]/40 text-[#ffdad6] border border-[#ffb4ab]/40"
      : "bg-[#571bc1]/30 text-[#e9ddff] border border-[#d0bcff]/40");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Creating account…";

  try {
    const data = await signUp({
      email: form.email.value.trim(),
      password: form.password.value,
      role: form.role.value,
      region: form.region.value,
    });

    // If Supabase requires email confirmation there is no session yet.
    if (data.session) {
      location.href = "pricing.html";
    } else {
      show("Account created. Check your inbox to confirm it, then log in.", "ok");
      btn.textContent = "Account created";
      form.reset();
    }
  } catch (err) {
    show(err.message || "Could not create the account.", "error");
    btn.disabled = false;
    btn.textContent = "Create free account";
  }
});
</script>
</body>
</html>
