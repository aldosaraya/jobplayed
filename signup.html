<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create your account | RadarJobs</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="site.css"/>
<script src="boot.js"></script>
<link rel="alternate" type="application/rss+xml" title="RadarJobs — latest openings" href="rss.xml"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23121317%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%278%27 fill=%27none%27 stroke=%27%23ddb7ff%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%272.5%27 fill=%27%23ddb7ff%27/%3E%3C/svg%3E"/>
</head>
<body>

<header class="page-head">
  <div class="bar">
    <a class="brand" href="index.html">RadarJobs</a>
    <nav class="top-nav" aria-label="Main">
      <a href="jobs.html">Explore jobs</a>
      <a href="pricing.html">Pricing</a>
    </nav>
    <div class="nav-slot" id="nav-auth"></div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Free, no card. These three answers set your default weekly filters.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@domain.com"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"/>
        <span class="hint">Eight characters or more.</span>
      </div>

      <div class="field">
        <label for="role">Primary role</label>
        <select id="role" name="role">
          <option value="tech">Software engineering &amp; architecture</option>
          <option value="data">Data science, analytics &amp; data engineering</option>
          <option value="design">Product design, UI/UX &amp; design systems</option>
          <option value="product">Product management &amp; tech operations</option>
          <option value="devops">DevOps, cloud infrastructure &amp; security</option>
          <option value="support">Customer support &amp; success</option>
          <option value="marketing">Marketing &amp; content</option>
          <option value="sales">Sales &amp; business development</option>
          <option value="admin">Admin, ops &amp; people</option>
          <option value="writing">Writing &amp; editing</option>
        </select>
      </div>

      <div class="field">
        <label for="region">Region</label>
        <select id="region" name="region">
          <option value="worldwide">Worldwide — no time-zone restriction</option>
          <option value="latam">Latin America only</option>
          <option value="america">Americas — overlapping hours</option>
          <option value="eu">Europe / UK</option>
        </select>
      </div>

      <div id="msg" class="auth-msg" hidden></div>

      <button class="btn btn-primary btn-block" id="submit-btn" type="submit">Create free account</button>

      <p class="auth-legal">
        By creating an account you agree to the <a href="legal.html">terms</a> and the
        <a href="privacy.html">privacy policy</a>.
      </p>
    </form>

    <p class="auth-foot">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>

<script type="module" src="app.js"></script>
<script type="module">
import { signUp } from "./auth.js";

const form = document.getElementById("signup-form");
const btn = document.getElementById("submit-btn");
const msg = document.getElementById("msg");

function show(text, kind) {
  msg.textContent = text;
  msg.hidden = false;
  msg.className = "auth-msg " + (kind === "error" ? "is-error" : "is-ok");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.hidden = true;

  const email = form.email.value.trim();
  const password = form.password.value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    show("Enter a valid email address.", "error");
    form.email.focus();
    return;
  }
  if (password.length < 8) {
    show("Use at least 8 characters for your password.", "error");
    form.password.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = "Creating account…";
  try {
    const data = await signUp({
      email,
      password,
      role: form.role.value,
      region: form.region.value,
    });

    // With email confirmation on, there is no session yet.
    if (data.session) {
      location.href = "account.html#alerts";
    } else {
      show("Account created. Confirm it from your inbox, then log in.", "ok");
      btn.textContent = "Account created";
      form.reset();
    }
  } catch (err) {
    show(err && err.message ? err.message : "Could not create the account.", "error");
    btn.disabled = false;
    btn.textContent = "Create free account";
  }
});
</script>
</body>
</html>
