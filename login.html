<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log in | RadarJobs</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="site.css"/>
<script src="boot.js"></script>
</head>
<body>

<header class="page-head">
  <div class="bar">
    <a class="brand" href="index.html">RadarJobs</a>
    <nav class="top-nav" aria-label="Main">
      <a href="jobs.html">Explore jobs</a>
      <a href="pricing.html">Pricing</a>
    </nav>
    <div class="nav-slot" id="nav-auth"></div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Log in</h1>
    <p class="auth-sub">Access your alerts, your plan and the weekly digest.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@domain.com"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password"/>
      </div>

      <div id="msg" class="auth-msg" hidden></div>

      <button class="btn btn-primary btn-block" id="submit-btn" type="submit">Log in</button>
    </form>

    <p class="auth-foot">
      No account yet? <a href="signup.html">Create one free</a>
    </p>
  </div>
</main>

<script type="module" src="app.js"></script>
<script type="module">
import { signIn, getSession } from "./auth.js";

const form = document.getElementById("login-form");
const btn = document.getElementById("submit-btn");
const msg = document.getElementById("msg");
const next = new URLSearchParams(location.search).get("next");

function show(text, kind) {
  msg.textContent = text;
  msg.hidden = false;
  msg.className = "auth-msg " + (kind === "error" ? "is-error" : "is-ok");
}

// Already signed in? Skip the form.
if (await getSession()) location.href = next || "jobs.html";

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.hidden = true;

  const email = form.email.value.trim();
  const password = form.password.value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    show("Enter a valid email address.", "error");
    form.email.focus();
    return;
  }
  if (!password) {
    show("Enter your password.", "error");
    form.password.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    await signIn(email, password);
    location.href = next || "jobs.html";
  } catch (err) {
    const raw = err && err.message ? err.message : "";
    show(
      /invalid login credentials/i.test(raw)
        ? "Wrong email or password."
        : /email not confirmed/i.test(raw)
          ? "Confirm your email first — the link is in your inbox."
          : raw || "Could not log in.",
      "error"
    );
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});
</script>
</body>
</html>
