name: Refresh job feed

on:
  schedule:
    # every 2 hours (GitHub retrasa los crons 10-30 min; esto da ~2-2.5h real)
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public ATS feeds
        run: python scraper/scrape.py --push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json rss.xml
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            COUNT=$(python -c "import json;print(len(json.load(open('jobs.json'))))")
            git commit -m "chore: refresh job feed (${COUNT} jobs) [skip ci]"
            git push
          fi
